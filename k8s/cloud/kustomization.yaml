apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../foodgram
  - ingress.yaml
patches:
  - path: backend-config-patch.yaml
  - path: frontend-service-patch.yaml
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
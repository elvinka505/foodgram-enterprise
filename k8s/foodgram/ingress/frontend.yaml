apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: foodgram
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - foodgram.local
      secretName: foodgram-tls
  rules:
    - host: foodgram.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
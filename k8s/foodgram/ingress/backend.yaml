apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: foodgram
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - foodgram.local
      secretName: foodgram-tls
  rules:
    - host: foodgram.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /s
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
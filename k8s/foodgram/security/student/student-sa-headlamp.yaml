apiVersion: v1
kind: ServiceAccount
metadata:
  name: student
  namespace: foodgram
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: student-read-pods
  namespace: foodgram
subjects:
  - kind: ServiceAccount
    name: student
    namespace: foodgram
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: student-headlamp-minimal
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: student-headlamp-minimal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: student-headlamp-minimal
subjects:
  - kind: ServiceAccount
    name: student
    namespace: foodgram
